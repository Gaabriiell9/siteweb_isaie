<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bienvenue au Temple de la Celebration</title>
</head>
<body style="margin: 0; padding: 0; background-color: #FFFBF5; font-family: Arial, Helvetica, sans-serif;">
  <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="background-color: #FFFBF5;">
    <tr>
      <td align="center" style="padding: 40px 20px;">

        <!-- Container principal -->
        <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="560" style="max-width: 560px; width: 100%;">

          <!-- Bandeau du haut -->
          <tr>
            <td align="center" style="background-color: #0E0600; padding: 24px 20px; border-radius: 8px 8px 0 0;">
              <span style="font-family: Arial, Helvetica, sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; color: #E8B84B;">
                Eglise Temple de la Celebration
              </span>
            </td>
          </tr>

          <!-- Corps du message -->
          <tr>
            <td style="background-color: #FFFFFF; padding: 48px 40px; border-left: 1px solid #E8E0D4; border-right: 1px solid #E8E0D4;">

              <!-- Titre -->
              <h1 style="margin: 0 0 24px 0; font-family: Georgia, 'Times New Roman', serif; font-size: 28px; font-weight: 400; color: #2A1200; text-align: center; line-height: 1.3;">
                Bienvenue dans la formation
              </h1>

              <!-- Texte explicatif -->
              <p style="margin: 0 0 16px 0; font-family: Arial, Helvetica, sans-serif; font-size: 16px; line-height: 1.6; color: #6B5540; text-align: center;">
                Ton paiement a ete confirme avec succes.
              </p>
              <p style="margin: 0 0 32px 0; font-family: Arial, Helvetica, sans-serif; font-size: 16px; line-height: 1.6; color: #6B5540; text-align: center;">
                Cree ton mot de passe pour acceder a ton espace eleve et commencer la formation theologique.
              </p>

              <!-- Bouton -->
              <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">
                <tr>
                  <td align="center" style="padding: 8px 0 32px 0;">
                    <a href="{{ .ConfirmationURL }}" target="_blank" style="display: inline-block; background-color: #6B1A2E; color: #FFFBF5; font-family: Arial, Helvetica, sans-serif; font-size: 13px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; text-decoration: none; padding: 16px 32px; border-radius: 6px; border: 1px solid #B87800;">
                      Creer mon mot de passe
                    </a>
                  </td>
                </tr>
              </table>

              <!-- Expiration -->
              <p style="margin: 0; font-family: Arial, Helvetica, sans-serif; font-size: 13px; color: #6B5540; text-align: center;">
                Ce lien expire dans 24 heures.
              </p>

            </td>
          </tr>

          <!-- Pied de page -->
          <tr>
            <td align="center" style="background-color: #0E0600; padding: 20px; border-radius: 0 0 8px 8px;">
              <p style="margin: 0; font-family: Arial, Helvetica, sans-serif; font-size: 12px; color: #6B5540;">
                Eglise Temple de la Celebration
              </p>
            </td>
          </tr>

        </table>

      </td>
    </tr>
  </table>
</body>
</html>
